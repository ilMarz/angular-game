<div class="container">
    <div class="row">
        <div class="col-md-4 col-md-offset-4">
              <mat-form-field class="example-full-width">
                <input matInput [(ngModel)]="username" placeholder="Username">
              </mat-form-field><br>
              <mat-form-field class="example-full-width">
                <input matInput type="password" [(ngModel)]="password" placeholder="Password">
              </mat-form-field> <br>              
              <button mat-raised-button color="primary" (click)="checkCredential()">Login</button>
              <button mat-raised-button color="link">Register</button>
          </div>
        </div>
</div>
