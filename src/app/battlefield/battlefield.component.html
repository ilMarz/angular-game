<div class="container">
<div *ngIf="!isExistingMatch || !matchReady">
    <span>Find match<input type="text" [(ngModel)]="matchId"></span>
    <button [disabled]="matchId==null" (click)="searchMatch()">click</button>
    <span>{{errorMessage}}</span>
</div>
<div *ngIf="isExistingMatch || matchReady">
{{matchState}} {{matchId}}
</div>

<label for="">Selected Item</label> {{selectedType}}
    
  <div class="row">
      <div class="col-md-1">
          <label for="">inseriti:</label>
          <div class="inserted-item" *ngFor="let inserted of itemList" (click)="removeItem(inserted.type)"> Type {{inserted.type}}</div>
      </div>
  <div class="grid-container" class="col-md-5">    
  <mat-grid-list cols={{colNumber}} rowHeight="1:1" >
    <mat-grid-tile  *ngFor="let num of range; let i = index" 
    (click)="clickedCellHandler(i)" 
    [class.type1selected]="checkIfCellIsSelectedByIndexAndSetColourByType(i,1)"
    [class.type2selected]="checkIfCellIsSelectedByIndexAndSetColourByType(i,2)"
    [class.type3selected]="checkIfCellIsSelectedByIndexAndSetColourByType(i,3)"
    [class.type4selected]="checkIfCellIsSelectedByIndexAndSetColourByType(i,4)"
    [class.type5selected]="checkIfCellIsSelectedByIndexAndSetColourByType(i,5)"
    [class.type6selected]="checkIfCellIsSelectedByIndexAndSetColourByType(i,6)"></mat-grid-tile>
  </mat-grid-list>
  </div>
  <div class="col-md-6">
    <mat-grid-list cols={{colNumber}} rowHeight="1:1" *ngIf="matchReady">
        <mat-grid-tile  *ngFor="let num of range; let i = index" 
        (click)="launchAttack(i)"
        [class.type1selected]="checkIfCellIsHit(i,1)"
        [class.type2selected]="checkIfCellIsHit(i,2)"
        [class.type3selected]="checkIfCellIsHit(i,3)"
        [class.type4selected]="checkIfCellIsHit(i,4)"
        [class.type5selected]="checkIfCellIsHit(i,5)"
        [class.type6selected]="checkIfCellIsHit(i,6)"
        ></mat-grid-tile>
    </mat-grid-list>
  </div>
  <div class="col-md-6 item-selector">
      <div class="container">
        <div class="row space-between">
            <button *ngFor="let item of [1,2,3,4,5,6]" 
            mat-raised-button color="primary" (click)="setType(item)" [disabled]="isDisabled(item)">{{item}}</button>
        </div>
      </div>
      <span *ngIf="completed && !isConfirmed" (click)="confirm()"><button mat-raised-button color="primary">Confirm</button></span>
  </div>
  <div class="col-md-6"></div>
  </div>
</div>
