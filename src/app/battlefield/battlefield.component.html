<div class="container">    
  <div class="row">
    <div class="col-md-2">
        <mat-card class="match-list">
            <mat-card-header>
                <mat-card-title>MATCH</mat-card-title>
                <mat-card-subtitle *ngIf="!matchReady"><input [(ngModel)]="matchId" matInput placeholder="find..."></mat-card-subtitle>
            </mat-card-header>
            <mat-card-content [style.overflow]="'auto'"  [style.height.px]="'400'">
                    <mat-action-list>
                        <mat-list-item (click)="selectMatch(match.payload.doc.id)" *ngFor="let match of openedMatchList | MatchFilter: matchId" role="listitem">{{match.payload.doc.id}}</mat-list-item>
                    </mat-action-list>
            </mat-card-content>
		</mat-card>
    </div>
    <div class="grid-container" class="col-md-5">   
            <div class="item-selector" *ngIf="!matchReady">
                    <div class="container" >
                      <div class="row space-between">
                          <button *ngFor="let item of [1,2,3,4,5,6]" 
                          mat-raised-button [ngClass]="getButtonStyle(item)" (click)="setType(item)" [disabled]="isDisabled(item)">{{item}}</button>
                      </div>
                    </div>
                    <span *ngIf="completed && !isConfirmed" (click)="confirm()"><button mat-raised-button color="primary">Confirm</button></span>
                </div>        

        <mat-grid-list cols={{colNumber}} rowHeight="1:1" >
            <mat-grid-tile  *ngFor="let num of range; let i = index" 
            (click)="clickedCellHandler(i)" 
            [ngClass]="checkIfCellIsHit(i)"
            ></mat-grid-tile>
        </mat-grid-list>
        <mat-card class="match-list">
            <mat-card-header>
                <mat-card-title>STATUS</mat-card-title>
            </mat-card-header>
            <mat-card-content style="background-color: black" [style.overflow]="'auto'"  [style.height.px]="'100'">
                <ul>
                    <li *ngFor="let msg of matchLog" style="color: green">status: {{msg}}</li>
                </ul>
            </mat-card-content>
		</mat-card>        
    </div>

  <div class="col-md-5" style="position: relative">
        <mat-grid-list cols={{colNumber}} rowHeight="1:1" *ngIf="matchReady">
            <ngx-ui-loader [loaderId]="'loader-01'">
            </ngx-ui-loader>
            <mat-grid-tile  *ngFor="let num of range; let i = index" 
            (click)="launchAttack(i)"
            [ngClass]="checkIfCellIsHitOnEnemyField(i)"
            ></mat-grid-tile>
        </mat-grid-list>
  </div>
  </div>
</div>
